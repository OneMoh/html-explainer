name: 功能建议
description: 提议一个新能力、新风格，或流程改进。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目刻意保持很小的接口面：HTML 帧进，MP4 出，音画同步稳得住。会增加构建系统、
        插件 API 或云依赖的提议，一般都在范围之外 —— 但如果你认为有重要的例外，请说明。

  - type: textarea
    id: problem
    attributes:
      label: 它解决什么问题？
      description: 描述你处的场景，而不是你想要的 API。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议的做法
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 画面风格 / 模板
        - 解说 / TTS
        - 字幕 / 节拍同步
        - 渲染
        - QC / 体检
        - 封面
        - 文档
        - 其它
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括「干脆手工做」—— 这也是个有效答案。
    validations:
      required: false
