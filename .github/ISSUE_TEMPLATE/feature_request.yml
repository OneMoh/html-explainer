name: Feature request
description: Propose a new capability, style, or workflow improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately keeps a small surface: HTML frames in, MP4 out, with
        audio-video sync that actually holds. Proposals that add a build system, a plugin
        API, or a cloud dependency are usually out of scope — but say so if you think
        there's an important exception.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in, not the API you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Visual styles / templates
        - Narration / TTS
        - Subtitles / beat sync
        - Rendering
        - QC / auditing
        - Covers
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "just do it manually" — it's a valid answer.
    validations:
      required: false
