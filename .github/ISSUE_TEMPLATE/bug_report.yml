name: Bug 报告
description: 画面渲错了、静默失败，或者直接崩了。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这条流水线是**静默**失败的 —— 一个坏掉的帧通常还是能产出一条看着挺像样的
        视频。下面这些信息你填得越全，定位得越快。

  - type: dropdown
    id: stage
    attributes:
      label: 哪个阶段出错了？
      options:
        - "0 · new_project（建项目）"
        - "1 · tts_build（配音）"
        - "2 · timeline_build（全局时间轴）"
        - "3 · subs（字幕 / 节拍）"
        - "4 · lint_frames（静态体检）"
        - "5 · render_video（渲染）"
        - "6 · qc_check（体检）"
        - "7 · cover_build（封面）"
        - "setup_env / 环境问题"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请附上你执行的完整命令与完整输出。
      placeholder: |
        命令：node scripts/render_video.mjs . --preview 30
        期望：30 秒预览，卡片有动画
        实际：预览渲出来了，但数字计数器一直不动
    validations:
      required: true

  - type: textarea
    id: symptom-class
    attributes:
      label: 它是报错了，还是静默出错？
      description: >
        静默失败才是这里最有价值的一类。如果视频能播但输出是错的
        （元素卡住、字幕不同步、文字缺失），请明确写出来。
    validations:
      required: false

  - type: input
    id: timestamp
    attributes:
      label: ★ 出错的位置在几分几秒？
      description: >
        如果画面本身有问题（元素错位、被压住、内容跑到字幕带上），请写清**在成片的第几分几秒**
        —— 有这个时间点，就能用 `scripts/frame_at.py --project . --at 1:23` 直接落到那一帧的
        图片（场景 id、帧号、源文件、当刻字幕块、终态帧一起给出），不用从头翻片子。
        多个位置就多写几个，逗号隔开。
      placeholder: "1:23（右下角示意图里小黑点没落在射线汇聚点上）；2:05（柱状图轴标签被底部条压住）"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: "跑一下这些，把结果贴上来。"
      value: |
        - 操作系统：
        - `node -v`：
        - `python -V`：
        - Shell（Git Bash / PowerShell / zsh）：
        - 渲染用浏览器（Chrome / Edge / playwright chromium）：
        - ffmpeg 来源（PATH / imageio-ffmpeg）：
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: SKILL.md 里的 `version:` 字段，或发布 tag。
      placeholder: "1.2.3"
    validations:
      required: true

  - type: textarea
    id: qc-output
    attributes:
      label: QC 输出（如果你已经跑到渲染那一步）
      description: 贴 `out/qc_report.md`，或附上抽帧速览图。
    validations:
      required: false
